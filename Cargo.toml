[package]
name = "rust_offline_map"
version = "0.1.0"
edition = "2021"

[dependencies]
galileo = "0.2"
galileo-egui = "0.2"
galileo-types = "0.2"
eframe = "0.31"
egui = "0.31"
parking_lot = "0.12"

osmpbf = "0.3"
rustc-hash = "2.0"

rusqlite = { version = "0.32", features = ["bundled"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
rfd = "0.15"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.5"
chrono = "0.4"

gpx = "0.10"

geojson = "0.24"

serde_json = "1.0"

